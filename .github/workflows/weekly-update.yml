# Once a week: fetches publications from the members' ORCID records, writes a news item for
# each new publication, fetches the GitHub star counts of the software packages, commits the
# changes and redeploys the site. Can also be started by hand: Actions -> Weekly update -> Run workflow.
#
# Optional secret ANTHROPIC_API_KEY (Settings -> Secrets and variables -> Actions): if set, the
# news summaries are written by Claude; otherwise they come from Semantic Scholar or the abstract.
name: Weekly update

on:
  schedule:
    - cron: "23 4 * * 1"   # Mondays, 04:23 UTC
  workflow_dispatch:

permissions:
  contents: write   # to commit the changes
  actions: write    # to start the deploy workflow

concurrency:
  group: data-update   # shared with the monthly publication map, so the two never push at the same time

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the Anthropic SDK (only if an API key is configured)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            pip install --quiet anthropic
          else
            echo "No ANTHROPIC_API_KEY secret: news summaries come from Semantic Scholar or the abstract."
          fi

      # All updates run even if one of them fails; failures are reported at the end.
      - name: Fetch publications (ORCID)
        id: publications
        continue-on-error: true
        run: python scripts/update_publications.py

      - name: Create news for new publications
        id: news
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/create_publication_news.py

      - name: Fetch GitHub stars
        id: stars
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_github_stars.py

      - name: Commit and deploy if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          paths="data/publications.json data/announced_publications.json data/github_stars.json content/news"
          if [ -z "$(git status --porcelain -- $paths)" ]; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $paths
          git commit -m "Weekly update: publications, news and GitHub stars"
          git push
          # Pushes made by this workflow do not trigger other workflows, so start the deployment explicitly.
          gh workflow run deploy.yml --ref "${{ github.ref_name }}"

      - name: Report failed updates
        if: steps.publications.outcome == 'failure' || steps.news.outcome == 'failure' || steps.stars.outcome == 'failure'
        run: |
          echo "::error::Update failed (publications: ${{ steps.publications.outcome }}, news: ${{ steps.news.outcome }}, stars: ${{ steps.stars.outcome }}). See the log above."
          exit 1
