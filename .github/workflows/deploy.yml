# Builds the site with Hugo and publishes it on GitHub Pages.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.170.1
      HUGO_ENVIRONMENT: production
      TZ: Europe/Berlin
    steps:
      - name: Install Hugo
        run: |
          curl -sSLo "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
      - uses: actions/checkout@v7
      - id: pages
        uses: actions/configure-pages@v6
      - name: Cache processed images
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/hugo_cache
          key: hugo-${{ hashFiles('content/**/*.jpg', 'content/**/*.jpeg', 'content/**/*.png', 'content/**/*.webp') }}
          restore-keys: hugo-
      - name: Build
        run: |
          hugo --gc --minify \
            --cacheDir "${{ runner.temp }}/hugo_cache" \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
