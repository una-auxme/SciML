# Builds the site with Hugo and publishes it on GitHub Pages: after every push to main (for example
# when a content update pull request is merged), every morning, and by hand (Actions -> Deploy site
# -> Run workflow). The daily build keeps date-dependent content current: members appear from their
# first day and move to "Former members" after their last day, projects are marked as completed,
# workshops as past. The GitHub star counts on the software page are fetched at every build.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "11 3 * * *"   # every day, 03:11 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.170.1
      HUGO_ENVIRONMENT: production
      TZ: Europe/Berlin
    steps:
      - name: Install Hugo
        run: |
          curl -sSLo "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fetch GitHub stars of the software packages
        continue-on-error: true   # if this fails, the numbers stored in data/github_stars.json are shown
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_github_stars.py
      - id: pages
        uses: actions/configure-pages@v6
      - name: Cache processed images
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/hugo_cache
          key: hugo-${{ hashFiles('content/**/*.jpg', 'content/**/*.jpeg', 'content/**/*.png', 'content/**/*.webp') }}
          restore-keys: hugo-
      - name: Build
        run: |
          hugo --gc --minify \
            --cacheDir "${{ runner.temp }}/hugo_cache" \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
