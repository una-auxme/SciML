# ---------------------------------------------------------------------------
#  Publication curation
#
#  Publications are fetched automatically from the ORCID records of all members
#  (field `orcid` on each member page) by scripts/update_publications.py, which
#  runs weekly on GitHub. Use this file only to correct or complete that list.
# ---------------------------------------------------------------------------

# Optional contact address sent along with API requests (recommended by Crossref).
contact_email = ""

# Publication types to list. Possible values:
# journal, conference, preprint, chapter, book, thesis, report, software, dataset, other
include_types = ["journal", "conference", "preprint", "chapter", "book", "thesis", "report"]

# Publications to hide, by DOI or by exact title (e.g. works wrongly attributed to a member).
exclude = [
  # "10.1234/not-our-paper",
]

# Add or change fields of a fetched publication, matched by `doi` (or by `title`).
# Possible fields: code, pdf, note, type, venue, title, authors, year, date, url
# Given `title` and `doi`, the DOI is added to the publication with that title (when it has none).
# [[override]]
# doi = "10.1234/abcd.5678"
# code = "https://github.com/your-org/your-repo"
# note = "Best Paper Award"

# Tobias's dissertation: ORCID lists it as a "book" with the supervisor as contributor.
[[override]]
title = "Scientific machine learning for hybrid modeling in real world engineering: Validated on examples from automotive and medical industry"
type = "thesis"
authors = ["Tobias Thummerer"]
venue = "University of Augsburg"
date = "2026-03-16"
url = "https://opus.bibliothek.uni-augsburg.de/opus4/130046"
pdf = "https://opus.bibliothek.uni-augsburg.de/opus4/files/130046/Thummerer_Diss.pdf"

# ECC 2026 paper: ORCID only has the year; publication date on IEEE Xplore.
[[override]]
title = "Neural ODE-based Optimal Thermal System Control for Electric Vehicles with multi-functional Heat Pump System"
date = "2026-08-07"

# ORCID entries without a DOI (found on Crossref and arXiv): the DOI adds authors, venue and link.
[[override]]
title = "Learnable & Interpretable Model Combination in Dynamic Systems Modeling"
doi = "10.48550/arXiv.2406.08093"

[[override]]
title = "Learning normalizing flow policies based on highway demonstrations"
doi = "10.1109/ITSC48978.2021.9564456"

[[override]]
title = "Learning to Drive from Observations while Staying Safe"
doi = "10.1109/IVWorkshops54471.2021.9669229"

