# Publications that are not on ORCID (better: add them to your ORCID record!).
# If you give a DOI, missing metadata is fetched automatically.
# `authors` are matched to members by name; `members` can list member folders explicitly.

# [[manual]]
# title = "Title of the paper"
# authors = ["First Author", "Tobias Thummerer"]
# year = 2026
# month = 5
# type = "conference"
# venue = "Proceedings of ..."
# url = "https://..."

# ---------------------------------------------------------------------------
#  News for new publications (scripts/create_publication_news.py, weekly)
#  Each new publication of the group gets a short news item: member authors,
#  title, venue and a one- or two-sentence summary of the abstract.
#  Already announced publications are listed in data/announced_publications.json.
# ---------------------------------------------------------------------------
[news]
enabled = true
types = ["journal", "conference", "preprint", "chapter", "book"]   # theses are announced by hand
max_age_days = 365      # publications older than this (e.g. added late to ORCID) are not announced
max_per_run = 5         # further new publications are announced in the following weeks

# ---------------------------------------------------------------------------
#  Publication map on the home page (scripts/update_publication_map.py, monthly)
#  Every publication of the group is a circle, sized by its number of citations. Lines: one
#  publication cites the other (solid) or both share at least `related_min_shared` references
#  (dashed). Citations come from OpenAlex and Crossref. A switch above the map changes the
#  grouping between methods and applications; the circles move to their new groups.
#  To show the group photo instead, set `publicationMap = false` in content/_index.md.
# ---------------------------------------------------------------------------
[map]
related_min_shared = 4

# How topics are assigned, in both groupings: a publication gets the topic whose keywords it
# contains most often (the title counts three times as much as the abstract). Keywords match the
# beginning of words, case-insensitive ("polic" matches "policy" and "policies"). At most six
# topics per grouping with the default colors (or give a topic its own `color`).
# The script prints how each publication was assigned; pin exceptions with [[map.paper]] below.

# Topic names are shown on the map as written here (Title Case).

# --- Grouping 1 (shown first): application areas. Publications without any keyword go to the
#     `fallback` topic (gray).
[[map.applications]]
name = "Automotive & E-Mobility"
keywords = ["automotive", "vehicle", "driving", "to drive", "highway", "traffic", "cabin", "powertrain",
            "charging station", "e-mobility", "heat pump"]

[[map.applications]]
name = "Mechatronics & Robotics"
