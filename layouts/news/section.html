{{ define "main" }}
<section class="page-head">
  <div class="container narrow">
    <h1>{{ .Title }}</h1>
    {{- with .Content }}<div class="lead">{{ . }}</div>{{ end }}
  </div>
</section>

<div class="container narrow">
  <div class="news-list">
    {{- range .Pages.ByDate.Reverse }}{{ partial "news-item.html" . }}{{ end }}
  </div>
</div>
{{ end }}
