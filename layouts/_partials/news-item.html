{{- /* A news item. Context: news page */ -}}
<article class="news-item">
  <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date | time.Format ":date_long" }}</time>
  <h3>{{ with .Params.link }}<a href="{{ partial "url.html" . }}">{{ $.Title }}</a>{{ else }}{{ .Title }}{{ end }}</h3>
  <div class="news-body">{{ .Content }}</div>
</article>
